plugins {
    id 'com.android.library' version '8.7.3'
}

android {
    namespace 'net.osmand.googlemaps.addon'
    compileSdk 35

    defaultConfig {
        minSdk 26
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
}

// The host OsmAnd integration is intentionally kept outside this library.
// A production build must provide a Google Maps SDK key through the host
// application's secure configuration, never through source control.
