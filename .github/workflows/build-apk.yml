name: Build OsmAnd 531003 with Google integration

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
  JAVA_TOOL_OPTIONS: "-Xmx6g -XX:MaxMetaspaceSize=1g"
  OSMAND_531003_REPO: "999nowa/net.osmand.plus_531003_src.tar.gz"
  OSMAND_531003_COMMIT: "db7ea927bc56cd3f6863040ce54c2891dc1f9f2d"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: ''

      - name: Show Java, Python and memory
        run: |
          set -euo pipefail
          java -version
          python3 --version
          free -h
          df -h .

      - name: Checkout exact OsmAnd 531003 source
        run: |
          set -euo pipefail
          git clone --recursive "https://github.com/${OSMAND_531003_REPO}.git" osmand-531003
          git -C osmand-531003 checkout --detach "$OSMAND_531003_COMMIT"
          git -C osmand-531003 submodule sync --recursive
          git -C osmand-531003 submodule update --init --recursive
          echo "531003 commit: $(git -C osmand-531003 rev-parse HEAD)"
          test "$(git -C osmand-531003 rev-parse HEAD)" = "$OSMAND_531003_COMMIT"
          test -f osmand-531003/android/settings.gradle
          test -f osmand-531003/android/OsmAnd/build.gradle
          test -f osmand-531003/build.sh
          test -f osmand-531003/prebuild.sh

      - name: Prepare 531003 build dependencies
        working-directory: osmand-531003
        run: |
          set -euo pipefail
          chmod +x build.sh prebuild.sh
          ./prebuild.sh

      - name: Audit 531003 source before integration
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          SRC="$ROOT/osmand-531003/android/OsmAnd"
          PLUS="$SRC/src/net/osmand/plus"
          for f in \
            "$ROOT/osmand-531003/android/gradlew" \
            "$ROOT/osmand-531003/android/settings.gradle" \
            "$SRC/build.gradle" \
            "$PLUS/search/QuickSearchHelper.java" \
            "$PLUS/settings/fragments/GlobalSettingsFragment.java" \
            "$SRC/res/xml/global_settings.xml" \
            "$PLUS/activities/MapActivity.java"; do test -f "$f"; done
          echo '--- 531003 version ---'
          grep -nE 'versionCode|versionName' "$SRC/build.gradle" | head -10
          echo '--- integration files in b ---'
          for f in \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GoogleSearchApi.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GoogleMapsPreferences.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GoogleSearchPreferences.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GooglePlacesSearchProvider.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GoogleSatelliteMapController.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GoogleAddressSearchClient.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/search/GoogleSearchSettings.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/addressocr/AddressOcrRouteActivity.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/addressocr/AddressOcrRouteLauncher.java" \
            "$ROOT/patches/enable_google_search.py"; do test -f "$f"; done
          python3 -m py_compile "$ROOT/patches/enable_google_search.py"

      - name: Apply Google and OCR integration to fixed 531003 base
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          SRC="$ROOT/osmand-531003/android/OsmAnd"
          mkdir -p "$SRC/src/net/osmand/plus/googlemaps"
          cp -R "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/." "$SRC/src/net/osmand/plus/googlemaps/"
          cp "$ROOT/OsmAnd/src/net/osmand/plus/search/GoogleSearchSettings.java" "$SRC/src/net/osmand/plus/search/GoogleSearchSettings.java"
          python3 "$ROOT/patches/enable_google_search.py" "$ROOT/osmand-531003"

      - name: Verify integration against 531003
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          SRC="$ROOT/osmand-531003/android/OsmAnd"
          PLUS="$SRC/src/net/osmand/plus"
          test -d "$PLUS/googlemaps"
          test -d "$PLUS/addressocr"
          grep -q 'GoogleSearchApi' "$PLUS/search/QuickSearchHelper.java"
          grep -q 'google_maps_api_key' "$SRC/res/xml/global_settings.xml"
          grep -q 'google_search_enabled' "$SRC/res/xml/global_settings.xml"
          grep -q 'GoogleMapsPreferences' "$PLUS/settings/fragments/GlobalSettingsFragment.java"
          grep -q 'GoogleSearchPreferences' "$PLUS/settings/fragments/GlobalSettingsFragment.java"
          grep -q 'AddressOcrRouteLauncher.install(this);' "$PLUS/activities/MapActivity.java"
          grep -q 'AddressOcrRouteActivity' "$SRC/AndroidManifest.xml"
          grep -q 'com.google.mlkit:text-recognition:16.0.1' "$SRC/build.gradle"
          echo '531003 integration audit passed'

      - name: Run OsmAnd Java tests
        working-directory: osmand-531003/android
        run: ./gradlew :OsmAnd-java:test --no-daemon --stacktrace --max-workers=2

      - name: Build OsmAnd 531003 Nightly debug APK
        working-directory: osmand-531003/android
        run: ./gradlew assembleNightlyFreeLegacyFatDebug --no-daemon --stacktrace --max-workers=2

      - name: Locate and inspect APK
        working-directory: osmand-531003/android
        run: |
          set -euo pipefail
          APK=$(find OsmAnd/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/app/build/outputs/apk/debug"
          cp "$APK" "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/osmand-531003-google-ocr.apk"
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osmand-531003-google-ocr-apk
          path: app/build/outputs/apk/debug/osmand-531003-google-ocr.apk
          retention-days: 90
