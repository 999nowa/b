name: Build OsmAnd Nightly with Google integration

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
  JAVA_TOOL_OPTIONS: "-Xmx6g -XX:MaxMetaspaceSize=1g"
  OSMAND_COMMIT: "55c111894e88cb7049dd796cc16b3c65fca24693"
  RESOURCES_COMMIT: "b22e0dfa8b3dbb2bb1c7449062041461033a2739"
  BUILD_COMMIT: "54356f2a6d1d07fe67510a25ec7912c0c63b277d"
  CORE_COMMIT: "b67c66154a4fdf09fc84614e3e283d677869329f"
  CORE_LEGACY_COMMIT: "caedfeac444670f74ea480ebc33083e8b65daf6e"
  TOOLS_COMMIT: "ebbc3211805d8d66a80663f97e5da6f894ed26e5"
  MISC_COMMIT: "fa7b6f3c9d4df0007a82f9f575eb1028b8acd52a"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: ''

      - name: Show Java, Python and memory
        run: |
          set -euo pipefail
          java -version
          python3 --version
          free -h

      - name: Clone exact OsmAnd Nightly base
        run: |
          set -euo pipefail
          git clone https://github.com/osmandapp/OsmAnd.git osmand-source
          git -C osmand-source checkout --detach "$OSMAND_COMMIT"
          echo "OsmAnd commit: $(git -C osmand-source rev-parse HEAD)"

      - name: Clone exact OsmAnd resources
        run: |
          set -euo pipefail
          git clone https://github.com/osmandapp/OsmAnd-resources.git resources
          git -C resources checkout --detach "$RESOURCES_COMMIT"
          echo "resources commit: $(git -C resources rev-parse HEAD)"

      - name: Clone exact OsmAnd build utilities
        run: |
          set -euo pipefail
          git clone https://github.com/osmandapp/OsmAnd-build.git build
          git -C build checkout --detach "$BUILD_COMMIT"
          echo "build commit: $(git -C build rev-parse HEAD)"

      - name: Clone exact OsmAnd core
        run: |
          set -euo pipefail
          git clone https://github.com/osmandapp/OsmAnd-core.git core
          git -C core checkout --detach "$CORE_COMMIT"
          echo "core commit: $(git -C core rev-parse HEAD)"

      - name: Clone exact OsmAnd core legacy
        run: |
          set -euo pipefail
          git clone https://github.com/osmandapp/OsmAnd-core-legacy.git core-legacy
          git -C core-legacy checkout --detach "$CORE_LEGACY_COMMIT"
          echo "core-legacy commit: $(git -C core-legacy rev-parse HEAD)"

      - name: Clone exact OsmAnd tools
        run: |
          set -euo pipefail
          git clone https://github.com/osmandapp/OsmAnd-tools.git tools
          git -C tools checkout --detach "$TOOLS_COMMIT"
          echo "tools commit: $(git -C tools rev-parse HEAD)"

      - name: Clone exact OsmAnd misc
        run: |
          set -euo pipefail
          git clone https://github.com/osmandapp/OsmAnd-misc.git misc
          git -C misc checkout --detach "$MISC_COMMIT"
          echo "misc commit: $(git -C misc rev-parse HEAD)"

      - name: Audit exact checkout structure and all integration paths
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PLUS="$ROOT/osmand-source/OsmAnd/src/net/osmand/plus"
          SEARCH="$PLUS/search"
          SETTINGS="$PLUS/settings/fragments"
          RES="$ROOT/osmand-source/OsmAnd/res"

          echo '--- top-level workspace ---'
          find "$ROOT" -maxdepth 2 -type d -print | sort

          echo '--- required repositories ---'
          for d in osmand-source resources build core core-legacy tools misc; do
            test -d "$ROOT/$d"
            test -d "$ROOT/$d/.git"
            echo "$d -> $(realpath "$ROOT/$d")"
          done

          echo '--- required OsmAnd application paths ---'
          for d in "$PLUS" "$SEARCH" "$SETTINGS" "$RES" "$RES/xml"; do
            test -d "$d"
            echo "DIR  $d"
          done

          echo '--- required upstream files ---'
          for f in \
            "$ROOT/osmand-source/gradlew" \
            "$ROOT/osmand-source/OsmAnd/build.gradle" \
            "$ROOT/osmand-source/OsmAnd/src/net/osmand/plus/search/QuickSearchHelper.java" \
            "$ROOT/osmand-source/OsmAnd/src/net/osmand/plus/settings/fragments/GlobalSettingsFragment.java" \
            "$ROOT/osmand-source/OsmAnd/res/xml/global_settings.xml" \
            "$ROOT/core-legacy/externals/configure.sh"; do
            test -f "$f"
            echo "FILE $f"
          done

          echo '--- required integration source files in b ---'
          for f in \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GoogleSearchApi.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GoogleMapsPreferences.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GoogleSearchPreferences.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GooglePlacesSearchProvider.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps/GoogleSatelliteMapController.java" \
            "$ROOT/OsmAnd/src/net/osmand/plus/search/GoogleSearchSettings.java" \
            "$ROOT/patches/enable_google_search.py"; do
            test -f "$f"
            echo "FILE $f"
          done

          echo '--- verify every copy source and destination parent ---'
          test -d "$ROOT/OsmAnd/src/net/osmand/plus/googlemaps"
          test -f "$ROOT/OsmAnd/src/net/osmand/plus/search/GoogleSearchSettings.java"
          test -d "$PLUS/googlemaps"
          test -d "$SEARCH"
          test -d "$SETTINGS"
          test -d "$RES/xml"

          echo '--- verify Python script is only in integration repo ---'
          test -f "$ROOT/patches/enable_google_search.py"
          test ! -e "$ROOT/osmand-source/tools/enable_google_search.py"
          python3 -m py_compile "$ROOT/patches/enable_google_search.py"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patches/enable_google_search.py').read_text(encoding='utf-8')
          forbidden = ['osmand-source/tools/enable_google_search.py', 'Path(__file__).parent / "osmand-source"']
          bad = [x for x in forbidden if x in p]
          if bad:
              raise SystemExit('Stale hard-coded integration path(s): ' + ', '.join(bad))
          print('Python path audit passed')
          PY

          echo '--- verify no integration source is accidentally taken from upstream ---'
          test ! -e "$ROOT/osmand-source/OsmAnd/src/net/osmand/plus/googlemaps/GoogleSearchApi.java"
          test ! -e "$ROOT/osmand-source/OsmAnd/src/net/osmand/plus/search/GoogleSearchSettings.java"

          echo '--- Gradle working-directory audit ---'
          test -x "$ROOT/osmand-source/gradlew" || chmod +x "$ROOT/osmand-source/gradlew"
          test -f "$ROOT/osmand-source/settings.gradle"
          test -d "$ROOT/osmand-source/OsmAnd"
          "$ROOT/osmand-source/gradlew" --version

      - name: Apply Google integration only after path audit
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/osmand-source/OsmAnd/src/net/osmand/plus"
          cp -R "$GITHUB_WORKSPACE/OsmAnd/src/net/osmand/plus/googlemaps/." "$SRC/googlemaps/"
          cp "$GITHUB_WORKSPACE/OsmAnd/src/net/osmand/plus/search/GoogleSearchSettings.java" "$SRC/search/GoogleSearchSettings.java"
          python3 "$GITHUB_WORKSPACE/patches/enable_google_search.py" "$GITHUB_WORKSPACE/osmand-source"

      - name: Verify Google patch was applied correctly
        working-directory: osmand-source
        run: |
          set -euo pipefail
          grep -q 'GoogleSearchApi' OsmAnd/src/net/osmand/plus/search/QuickSearchHelper.java
          grep -q 'google_maps_api_key' OsmAnd/res/xml/global_settings.xml
          grep -q 'google_search_enabled' OsmAnd/res/xml/global_settings.xml
          grep -q 'GoogleMapsPreferences' OsmAnd/src/net/osmand/plus/settings/fragments/GlobalSettingsFragment.java
          grep -q 'GoogleSearchPreferences' OsmAnd/src/net/osmand/plus/settings/fragments/GlobalSettingsFragment.java
          test -f OsmAnd/src/net/osmand/plus/googlemaps/GoogleSearchApi.java
          test -f OsmAnd/src/net/osmand/plus/googlemaps/GoogleSatelliteMapController.java
          if grep -R -n 'com.google.android.gms.maps' OsmAnd/src/net/osmand/plus/googlemaps; then
            echo 'ERROR: obsolete Google Maps Android SDK dependency remains in integration sources'
            exit 1
          fi
          if grep -R -n 'osmand-source/tools/enable_google_search.py' ../patches .github 2>/dev/null; then
            echo 'ERROR: stale patch-script destination reference remains'
            exit 1
          fi

      - name: Configure Gradle
        working-directory: osmand-source
        run: |
          set -euo pipefail
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8\norg.gradle.daemon=false\n' >> gradle.properties
          ./gradlew --version

      - name: Run OsmAnd Java tests
        working-directory: osmand-source
        run: ./gradlew :OsmAnd-java:test --no-daemon --stacktrace --max-workers=2

      - name: Build OsmAnd Nightly debug APK
        working-directory: osmand-source
        run: ./gradlew assembleNightlyFreeLegacyFatDebug --no-daemon --stacktrace --max-workers=2

      - name: Locate and inspect APK
        working-directory: osmand-source
        run: |
          set -euo pipefail
          APK=$(find OsmAnd/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          echo "APK: $APK"
          mkdir -p ../app/build/outputs/apk/debug
          cp "$APK" ../app/build/outputs/apk/debug/osmand-google-nightly.apk
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging ../app/build/outputs/apk/debug/osmand-google-nightly.apk | head -n 5
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osmand-google-nightly-apk
          path: app/build/outputs/apk/debug/osmand-google-nightly.apk
          retention-days: 90

      - name: Commit APK when below GitHub's 100 MB file limit
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/osmand-google-nightly.apk
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -ge 104857600 ]; then
            echo "APK is ${SIZE} bytes and exceeds GitHub's 100 MB normal-file limit. Artifact remains available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APK"
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "Build verified OsmAnd Nightly APK"
            git push origin HEAD:main
          fi
