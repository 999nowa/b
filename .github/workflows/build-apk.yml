name: Build OsmAnd~ 5.3.10 with Google integration

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
  JAVA_TOOL_OPTIONS: "-Xmx6g -XX:MaxMetaspaceSize=1g"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: ''

      - name: Show available memory
        run: free -h

      - name: Clone OsmAnd 5.3 base
        run: git clone --depth 1 --branch r5.3 https://github.com/osmandapp/OsmAnd.git osmand-source

      - name: Clone OsmAnd resources
        run: git clone --depth 1 https://github.com/osmandapp/OsmAnd-resources.git resources

      - name: Clone OsmAnd build utilities
        run: git clone --depth 1 https://github.com/osmandapp/OsmAnd-build.git build

      - name: Validate OsmAnd checkout
        run: |
          set -e
          test -f osmand-source/gradlew
          test -d osmand-source/OsmAnd/src/net/osmand/plus

      - name: Apply Google integration files
        run: |
          set -e
          SRC="osmand-source/OsmAnd/src/net/osmand/plus"
          mkdir -p "$SRC/googlemaps"
          cp -R OsmAnd/src/net/osmand/plus/googlemaps/. "$SRC/googlemaps/"
          mkdir -p "$SRC/search"
          cp OsmAnd/src/net/osmand/plus/search/GoogleSearchSettings.java "$SRC/search/GoogleSearchSettings.java"
          mkdir -p osmand-source/tools
          cp patches/enable_google_search.py osmand-source/tools/enable_google_search.py
          python3 osmand-source/tools/enable_google_search.py

      - name: Configure Gradle memory and build settings
        working-directory: osmand-source
        run: |
          set -e
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8\norg.gradle.daemon=false\n' >> gradle.properties
          java -version
          ./gradlew --version

      - name: Make Gradle wrapper executable
        working-directory: osmand-source
        run: chmod +x gradlew

      - name: Build OsmAnd~ 5.3.10 debug APK
        working-directory: osmand-source
        run: ./gradlew :OsmAnd:assembleNightlyFreeLegacyFatDebug --no-daemon --stacktrace --max-workers=2

      - name: Locate and publish APK
        run: |
          set -e
          APK=$(find osmand-source -type f -path '*/build/outputs/apk/*.apk' | head -n 1)
          test -n "$APK"
          echo "Found APK: $APK"
          mkdir -p app/build/outputs/apk/debug
          cp "$APK" app/build/outputs/apk/debug/osmand-google-5.3.10.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osmand-google-5.3.10-apk
          path: app/build/outputs/apk/debug/osmand-google-5.3.10.apk
          retention-days: 90

      - name: Commit APK when below GitHub's 100 MB file limit
        run: |
          set -e
          APK=app/build/outputs/apk/debug/osmand-google-5.3.10.apk
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -ge 104857600 ]; then
            echo "APK is ${SIZE} bytes and exceeds GitHub's 100 MB normal-file limit. Artifact is available instead."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APK"
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "Add OsmAnd 5.3.10 Google integration APK"
            git push origin HEAD:main
          fi
