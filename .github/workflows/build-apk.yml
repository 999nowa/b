name: Build OsmAnd with integration

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: ''

      - name: Clone OsmAnd source
        run: git clone --depth 1 --branch feature/google-maps-satellite https://github.com/999nowa/OsmAnd.git osmand-source

      - name: Clone OsmAnd resources
        run: git clone --depth 1 https://github.com/osmandapp/OsmAnd-resources.git resources

      - name: Clone OsmAnd build utilities
        run: git clone --depth 1 https://github.com/osmandapp/OsmAnd-build.git build

      - name: Validate OsmAnd checkout
        run: |
          set -e
          test -f osmand-source/gradlew
          test -d osmand-source/OsmAnd/src/net/osmand/plus

      - name: Apply integration files
        run: |
          set -e
          SRC="osmand-source/OsmAnd/src/net/osmand/plus"
          mkdir -p "$SRC/googlemaps"
          cp -R OsmAnd/src/net/osmand/plus/googlemaps/. "$SRC/googlemaps/"
          mkdir -p "$SRC/search"
          cp OsmAnd/src/net/osmand/plus/search/GoogleSearchSettings.java "$SRC/search/GoogleSearchSettings.java"
          mkdir -p osmand-source/docs
          cp docs/*.md osmand-source/docs/

      - name: Make Gradle wrapper executable
        working-directory: osmand-source
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: osmand-source
        run: ./gradlew :OsmAnd:assembleNightlyFreeLegacyFatDebug --no-daemon --stacktrace

      - name: Locate and publish APK
        run: |
          set -e
          APK=$(find osmand-source -type f -path '*/build/outputs/apk/*.apk' | head -n 1)
          test -n "$APK"
          echo "Found APK: $APK"
          mkdir -p app/build/outputs/apk/debug
          cp "$APK" app/build/outputs/apk/debug/lugnt-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lugnt-debug-apk
          path: app/build/outputs/apk/debug/lugnt-debug.apk
          retention-days: 90

      - name: Commit APK when below GitHub's 100 MB file limit
        run: |
          set -e
          APK=app/build/outputs/apk/debug/lugnt-debug.apk
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -ge 104857600 ]; then
            echo "APK is ${SIZE} bytes and exceeds GitHub's 100 MB normal-file limit. Artifact is available instead."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APK"
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "Add latest OsmAnd integration debug APK"
            git push origin HEAD:main
          fi
